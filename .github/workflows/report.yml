name: Progress report

# Validates the committed progress report (progress/report.json, the objdiff report shape) on every push to main. The
# report is written by the maintainer's pipeline from its match records; nothing from the game is needed here, and
# nothing is uploaded anywhere.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report present
        id: report
        run: echo "present=$([ -f progress/report.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Validate the report
        if: steps.report.outputs.present == 'true'
        run: python3 -c "import json; r=json.load(open('progress/report.json')); print(r['measures'])"
