name: Progress report

# Uploads the committed progress report (progress/report.json, the objdiff-report shape decomp.dev reads) as the
# artifact redakai-vs-lokar-flash_report, only when the repository variable DECOMP_DEV_UPLOAD is 1 (set at registration time; a Flash
# target generates the report for its README and is not expected to be listed). The report is written by the
# maintainer's pipeline from its match records; nothing from the game is needed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report present
        id: report
        run: echo "present=$([ -f progress/report.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Validate the report
        if: steps.report.outputs.present == 'true'
        run: python3 -c "import json; r=json.load(open('progress/report.json')); print(r['measures'])"
      - name: Upload the decomp.dev report
        if: steps.report.outputs.present == 'true' && vars.DECOMP_DEV_UPLOAD == '1'
        uses: actions/upload-artifact@v4
        with:
          name: redakai-vs-lokar-flash_report
          path: progress/report.json
          if-no-files-found: error
